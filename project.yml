name: BudgetLeagueTracker
options:
  bundleIdPrefix: com.budgetleague
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.15.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  BudgetLeagueTracker:
    type: application
    platform: iOS
    sources:
      - path: BudgetLeagueTracker
        type: group
      - path: Assets.xcassets
      - path: Resources/GoogleService-Info.plist
        type: file
        buildPhase: resources
        optional: true
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      - name: Firebase Crashlytics
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi
          if ! [ -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            exit 0
          fi
          if grep -q "REPLACE_WITH" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" 2>/dev/null; then
            exit 0
          fi
          RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -f "$RUN_SCRIPT" ]; then
            echo "warning: Crashlytics run script not found at $RUN_SCRIPT"
            exit 0
          fi
          "${RUN_SCRIPT}"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetleague.BudgetLeagueTracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "League Keeper"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2025. All rights reserved."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  BudgetLeagueTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetLeagueTrackerTests
        type: group
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: BudgetLeagueTracker
      - package: ViewInspector
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetleague.BudgetLeagueTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetLeagueTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BudgetLeagueTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BudgetLeagueTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BudgetLeagueTrackerUITests
        type: group
    dependencies:
      - target: BudgetLeagueTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetleague.BudgetLeagueTrackerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BudgetLeagueTracker
schemes:
  BudgetLeagueTracker:
    build:
      targets:
        BudgetLeagueTracker: all
    run:
      config: Debug
    test:
      targets:
        - BudgetLeagueTrackerTests
        - BudgetLeagueTrackerUITests
  BudgetLeagueTrackerCI:
    build:
      targets:
        BudgetLeagueTracker: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - BudgetLeagueTracker
      targets:
        - BudgetLeagueTrackerTests
    run:
      config: Debug
  BudgetLeagueTrackerUI:
    build:
      targets:
        BudgetLeagueTracker: all
    test:
      targets:
        - BudgetLeagueTrackerUITests
    run:
      config: Debug
